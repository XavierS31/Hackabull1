; Node B — Glove (ESP32 dev board: TFT + MPU-6050 + IR + Buzzer)
; No camera on this node. Outputs:
;   - 10 Hz IMU/IR JSON telemetry over UDP to the orchestrator (port 9002)
;   - Local TFT status display + buzzer alerts

[env:node_b_glove]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; All TFT_eSPI options are passed via build_flags so we don't have to edit
; the library's User_Setup.h. USER_SETUP_LOADED=1 tells TFT_eSPI to skip
; its bundled config and use these defines instead.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_GREENTAB
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=128
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000

; Uncomment and set if auto-detect fails.
; upload_port = COM4
; monitor_port = COM4
