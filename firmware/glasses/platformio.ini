; Node A — Glasses (AI-Thinker ESP32-CAM, OV2640)
; MJPEG stream on http://<ip>:81/stream

[env:glasses]
platform = espressif32@^6.7.0
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; AI-Thinker ESP32-CAM has PSRAM; this gives the camera a larger frame buffer pool.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=0

; Camera firmware is large; use a partition table that gives more app space.
board_build.partitions = huge_app.csv

; Uncomment and set if auto-detect fails. On Windows it looks like COM3, COM4, etc.
; upload_port = COM3
; monitor_port = COM3
